<div class="container py-5 position-relative" style="min-height: 400px;">
  <div class="row justify-content-center align-items-center">
    <!-- Cards Group -->
    <div class="col-auto position-relative" style="min-width: 520px;">
      <div class="row g-3">
        <div class="col-md-6" *ngFor="let card of cards.slice(0,2)">
          <div class="card shadow" style="width: 28rem; margin: 0 auto;">
            <img [src]="card.img" [alt]="card.title" class="card-img-top">
            <div class="card-body">
              <h5 class="card-title d-flex align-items-center justify-content-between">
                {{ card.title }}
                <span class="badge" [ngClass]="card.badgeClass">{{ card.badge }}</span>
              </h5>
              <p class="card-text">{{ card.description }}</p>
              <ul class="list-unstyled mb-3">
                <li *ngFor="let feature of card.features">
                  ✔️ {{ feature }}
                </li>
              </ul>
              <a class="btn btn-link p-0 mb-2" href="#">Learn more</a>
              <button class="btn w-100" [ngClass]="card.btnClass">
                {{ card.btnText }}
              </button>
            </div>
          </div>
        </div>
        <div class="col-md-6" *ngFor="let card of cards.slice(2,4)">
          <div class="card shadow" style="width: 28rem; margin: 0 auto;">
            <img [src]="card.img" [alt]="card.title" class="card-img-top">
            <div class="card-body">
              <h5 class="card-title d-flex align-items-center justify-content-between">
                {{ card.title }}
                <span class="badge" [ngClass]="card.badgeClass">{{ card.badge }}</span>
              </h5>
              <p class="card-text">{{ card.description }}</p>
              <ul class="list-unstyled mb-3">
                <li *ngFor="let feature of card.features">
                  ✔️ {{ feature }}
                </li>
              </ul>
              <a class="btn btn-link p-0 mb-2" href="#">Learn more</a>
              <button class="btn w-100" [ngClass]="card.btnClass">
                {{ card.btnText }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
